---
layout: none
---

<!doctype html>
<html>
    <head>
        <script src="assets/js/vm-script.js"></script>
        <link rel="stylesheet" href="assets/css/projectStyle.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=VT323">
    </head>
    <body onload="onLoad()">
        <div class="sakura-branches">
            <div class="top-sakura-branch-shadow"></div>
            <div class="top-sakura-branch"></div>
            <div class="bottom-sakura-branch-shadow"></div>
            <div class="bottom-sakura-branch"></div>
        </div>
        <div class="container-h">
            <div class="top-free-space">
                <div class="container-v container-v-top">
                    <div class="left-free-space"></div>
                    <div class="shadow-cover"></div>
                    <div class="cat-top"></div>
                    <div class="shadow-cover"></div>
                </div>
            </div>
            <div class="container-v">
                <div class="shadow-cover"></div>
                <div class="left-free-space"></div>
                <div class="bg">
                    <div class="stock">
                        <div class="product-display-light-reflection"></div>
                        <div class="cat-tail tail-reflection"></div>
                        <div class="cat-tail"></div>
                        <div class="display">
                            <div class="display-light-reflection"></div>
                            <div class="display-text-field">
                                <span id="text-on-screen" class="typewriter-effect display-screen-clip">
                            </div>
                        </div>
                        <div class="coin-slot">  
                            <div class="coin">
                            </div>
                        </div>    
                        <div class="productivity-timer">
                            <div class="productivity-timer-highlight highlight" onclick="showProjectDescription(0)">             
                            </div>
                        </div>
                        <div class="light-item-in-stock productivity-timer-light-icon top-shelf"></div>
                        <div class="pen-guin-bot">
                            <div class="pen-guin-bot-highlight highlight" onclick="showProjectDescription(1)">             
                            </div>
                        </div>
                        <div class="light-item-in-stock pen-guin-bot-light-icon top-shelf"></div>
                        <div class="shopping-app-placeholder">
                            <div class="shopping-app-placeholder-highlight highlight" onclick="showProjectDescription(4)">             
                            </div>
                        </div>
                        <div class="light-item-out-of-stock top-shelf light-item-out-of-stock-top-shelf-1"></div>
                        <div class="light-item-out-of-stock top-shelf light-item-out-of-stock-top-shelf-2"></div>
                        <div class="light-item-out-of-stock top-shelf light-item-out-of-stock-top-shelf-3"></div>
                        <div class="light-item-out-of-stock top-shelf light-item-out-of-stock-top-shelf-4"></div>
                        <div class="light-item-out-of-stock top-shelf light-item-out-of-stock-top-shelf-5"></div>

                        <div class="light-item-out-of-stock light-item-bottom-shelf light-item-out-of-stock-bottom-shelf-1"></div>
                        <div class="light-item-out-of-stock light-item-bottom-shelf light-item-out-of-stock-bottom-shelf-2"></div>
                        <div class="light-item-out-of-stock light-item-bottom-shelf light-item-out-of-stock-bottom-shelf-3"></div>
                        <div class="light-item-out-of-stock light-item-bottom-shelf light-item-out-of-stock-bottom-shelf-4"></div>
                        <div class="light-item-out-of-stock light-item-bottom-shelf light-item-out-of-stock-bottom-shelf-5"></div>
                        <div class="light-item-out-of-stock light-item-bottom-shelf light-item-out-of-stock-bottom-shelf-6"></div>
                        <div class="light-item-out-of-stock light-item-bottom-shelf light-item-out-of-stock-bottom-shelf-7"></div>
                    </div>
                </div>
                <div class="shadow-cover"></div>
            </div>
            <div class="bottom-free-space">
                <div class="container-v container-v-bottom">
                    <div class="shadow-cover"></div>
                    <div class="left-free-space"></div>
                    <div class="vm-bottom"></div>
                    <div class="shadow-cover"></div>
                </div>
            </div>
        </div>
        <div class="light-pole-block">
            <div class="light-pole">
                <div class="email-highlight highlight"></div>
                <div class="github-highlight highlight"></div>
                <div class="linkedin-highlight highlight"></div>
                <div class="cv-pdf-highlight highlight"></div>
            </div>
            <div class="light-pole-bottom"></div>
        </div>
    </body>
</html>
